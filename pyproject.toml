[project]
name = "datasette-libfec"
version = "0.0.1a22"
description = ""
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1a23",
    "datasette-plugin-router>=0.0.1a2",
    "datasette-vite>=0.0.1a4",
    "libfec>=0.0.25",
    "sqlite-migrate>=0.1b0",
    "sqlite-utils>=3.38",
    "python-ulid>=3",
    "datasette-alerts>=0.0.1a10"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.0",
]
alerts = [
    "datasette-alerts>=0.0.1a8",
]

[project.optional-dependencies]
# `datasette-libfec[paper]` adds datasette-paper so an FEC candidate can be
# pasted/embedded as a rich block inside a paper document (see paper.py + the
# frontend paper-embed target). The plugin itself is a no-op without it, so the
# default install (and CI) never needs this extra.
#
# datasette-paper isn't on PyPI yet, so this extra only resolves once it's
# published or supplied locally, e.g. from a sibling checkout's built wheel:
#   uv sync --extra paper \
#     --find-links ../datasette-paper/dist
# Keep the local wheel path out of committed config so it doesn't break
# checkouts / CI that lack the sibling directory.
paper = [
    "datasette-paper>=0.0.2a3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-libfec"
Changelog = "https://github.com/datasette/datasette-libfec/releases"
Issues = "https://github.com/datasette/datasette-libfec/issues"
CI = "https://github.com/datasette/datasette-libfec/actions"

[project.entry-points.datasette]
libfec = "datasette_libfec"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
datasette_libfec = ["static/**/*", "templates/*", "manifest.json", "schema.sql"]

[tool.setuptools.packages.find]
exclude = [
    "frontend",
]
